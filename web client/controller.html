<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arkanoid LG Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0e14;
            color: #e8f4f8;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: #0d1117;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 rgba(0, 229, 255, 0.3);
            transition: all 0.1s;
        }

        .icon-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 20, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0d1117;
            padding: 30px;
            border-radius: 3px;
            border: 3px solid #00e5ff;
            box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.4);
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        h1, h2, h3 {
            font-family: 'VT323', monospace;
            color: #00e5ff;
            font-size: 28px;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0d1117;
            border: 2px solid #00e5ff;
            color: #e8f4f8;
            font-size: 16px;
            font-family: 'JetBrains Mono', monospace;
            box-sizing: border-box;
            border-radius: 3px;
            text-align: center;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.35), inset 0 0 0 1px rgba(0, 229, 255, 0.4);
            transition: box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.6), inset 0 0 0 1px rgba(0, 229, 255, 0.6);
        }

        button.action-btn {
            background: #0d1117;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: normal;
            font-family: 'VT323', monospace;
            letter-spacing: 1px;
            line-height: 1.4;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 15px;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.35), inset 0 0 0 1px rgba(0, 229, 255, 0.4);
            transition: all 0.1s;
        }

        button.action-btn:hover, button.action-btn:focus {
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.6), inset 0 0 0 1px rgba(0, 229, 255, 0.6);
        }

        button.action-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.4);
        }

        .hidden { display: none !important; }

        #joinArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }

        #gameArea {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .touch-pad {
            width: 90%;
            height: 60vh;
            background: transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            overflow: hidden;
        }

        .touch-pad::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 229, 255, 0.3);
            top: 50%;
            transform: translateY(-50%);
        }

        #touchPuck {
            width: 50px;
            height: 50px;
            background: #00e5ff;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="top-right">
        <button class="icon-btn" onclick="document.getElementById('aboutModal').style.display='flex'">?</button>
    </div>

    <div id="joinArea">
        <h1>LG Arkanoid</h1>
        <p>Enter Session Token from Rig</p>
        <input type="text" id="tokenInput" placeholder="Token (e.g. abc123def)" />
        <button class="action-btn" onclick="joinGame()">Join Game</button>
    </div>

    <div id="gameArea" class="hidden">
        <h2 id="playerStatus">Connected</h2>
        <div class="touch-pad" id="touchPad">
            <div id="touchPuck"></div>
        </div>
    </div>

    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <img src="assets/lg-logo.png" alt="Liquid Galaxy Logo" style="max-height: 40px; display: block; margin: 0 auto 10px auto;">
            <h3>Author</h3>
            <p>Anirudh Pratap Singh Yadav</p>
            <p>for the gemini summer of code by liquid galaxy</p>
            <button class="action-btn" onclick="document.getElementById('aboutModal').style.display='none'">Close</button>
        </div>
    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.0/socket.io.min.js"></script>
    <script>
        let socket;
        let isConnected = false;


        function joinGame() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) return alert('Please enter a token');

            socket = io(window.location.origin, {
                query: { controller: 'true' },
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                const nonce = Math.random().toString(36).substring(2, 15);
                socket.emit('player_join', { sessionToken: token, timestamp: Date.now(), nonce });
            });

            socket.on('join_confirmed', (data) => {
                isConnected = true;
                document.getElementById('joinArea').classList.add('hidden');
                document.getElementById('gameArea').classList.remove('hidden');
                document.getElementById('playerStatus').innerText = 'Player ' + data.playerNumber;
                setupTouchControls();
                
                // Initialize speech synthesis on user interaction
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            });

            socket.on('join_rejected', (data) => {
                alert('Join failed: ' + data.message);
                socket.disconnect();
            });

            socket.on('commentary', (data) => {
                if (data && data.text && 'speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.rate = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
            });
        }

        function setupTouchControls() {
            const pad = document.getElementById('touchPad');
            let lastX = 0;

            pad.addEventListener('touchstart', (e) => {
                lastX = e.touches[0].clientX;
            });

            pad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isConnected) return;
                
                const currentX = e.touches[0].clientX;
                const deltaX = currentX - lastX;
                
                const rigDeltaX = deltaX * 10; 
                
                const puck = document.getElementById('touchPuck');
                if (puck) {
                    let currentTransform = puck.style.transform || 'translateX(0px)';
                    let match = currentTransform.match(/translateX\(([^px]+)px\)/);
                    let currentOffset = match ? parseFloat(match[1]) : 0;
                    currentOffset += deltaX;
                    
                    const maxSlide = pad.clientWidth / 2 - 25;
                    currentOffset = Math.max(-maxSlide, Math.min(maxSlide, currentOffset));
                    puck.style.transform = `translateX(${currentOffset}px)`;
                }

                if (Math.abs(rigDeltaX) > 0) {
                    const nonce = Math.random().toString(36).substring(2, 15);
                    socket.emit('paddle_move', { 
                        deltaX: rigDeltaX, 
                        timestamp: Date.now(), 
                        nonce 
                    });
                }
                
                lastX = currentX;
            });

            pad.addEventListener('touchend', () => {
                const puck = document.getElementById('touchPuck');
                if (puck) puck.style.transform = `translateX(0px)`;
            });
        }
    </script>
</body>
</html>
