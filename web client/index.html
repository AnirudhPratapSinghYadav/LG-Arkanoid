<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LG Arkanoid">
    <link rel="apple-touch-icon" href="/assets/lg-logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>LG Arkanoid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="qrcode">
        <h2 style="font-family: 'VT323', monospace; font-size: 2.8rem; color: #fff; margin: 0 0 20px 0; letter-spacing: 2px;">SCAN TO JOIN</h2>
        <div id="qrcode-img"></div>
        <div style="font-family: 'VT323', monospace; font-size: 2rem; color: #4ade80; margin-top: 30px; letter-spacing: 2px;">Session Code</div>
        <div id="qr-session-code" style="font-family: 'VT323', monospace; font-size: 5rem; color: #fff; margin-top: 10px; letter-spacing: 15px;"></div>
        <div id="qr-instructions" style="font-family: 'VT323', monospace; font-size: 2rem; color: #aaa; margin-top: 40px; line-height: 1.8;">
            Open the LG Arkanoid app<br/>OR<br/>Enter code <span id="qr-session-code-inline" style="color: #fff;"></span><br/><br/>
            <span id="qr-waiting-text" style="color: #4ade80;">Waiting for first player...</span>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
