# Keep Gradle lean — Windows hosts often have <1GB free with browsers open.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.daemon=false
android.useAndroidX=true
android.lint.checkReleaseBuilds=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

kotlin.incremental=false
