name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-server-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 16 = LG Ubuntu 16.04 / glibc ceiling. Also verify modern LTS.
        node-version: [16, 18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Audit Production Dependencies
        # Vite is pinned to 4.x for Node 16 / LG glibc compatibility (dev-only).
        # Audit production deps so the intentional Vite pin does not fail CI.
        run: npm audit --omit=dev --audit-level=high

      - name: Run Server Tests
        run: npm test

      - name: Socket.IO E2E
        env:
          PORT: 8130
          NUM_SCREENS: 3
          GEMINI_API_KEY: ""
          NODE_ENV: development
        run: |
          node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8130/health && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8130/health
          node server/tests/e2e-multi-client.test.js
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

      - name: Build Web Client
        run: npm run build

  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Analyze Flutter Code
        run: flutter analyze
        working-directory: ./mobile

      - name: Build split-per-ABI release APKs
        # Matches the GO Web Store size target (<50 MB). R8 minify + resource
        # shrinking are enabled in android/app/build.gradle.kts. arm64-v8a is
        # the APK that goes to the store; the others exist for emulators.
        run: flutter build apk --release --split-per-abi
        working-directory: ./mobile
