name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-server-client:
    runs-on: ${{ matrix.node-version == 16 && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        # Node 16 = LG Ubuntu 16.04 / glibc ceiling. Also verify modern LTS.
        node-version: [16, 18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Audit Production Dependencies
        # Vite is pinned to 4.x for Node 16 / LG glibc compatibility (dev-only).
        # Audit production deps so the intentional Vite pin does not fail CI.
        run: npm audit --omit=dev --audit-level=high

      - name: Run Server Tests
        run: npm test

      - name: Socket.IO E2E
        env:
          PORT: 8130
          NUM_SCREENS: 3
          GEMINI_API_KEY: ""
          NODE_ENV: development
        run: |
          node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8130/health && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8130/health
          node server/tests/e2e-multi-client.test.js
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

      - name: Build Web Client
        run: npm run build

  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Analyze Flutter Code
        run: flutter analyze
        working-directory: ./mobile

      - name: Build split-per-ABI release APKs
        # Maven Central sometimes returns 429 on GitHub-hosted runners.
        # Retry a few times so a rate-limit does not fail a green tree.
        # Daemon is off in gradle.properties so a JVM OOM cannot linger.
        working-directory: ./mobile
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
        run: |
          for i in 1 2 3 4 5; do
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            echo "APK build failed (try $i). Waiting before retry..."
            sleep $((i * 20))
          done
          exit 1
