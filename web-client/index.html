<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LG Arkanoid">
    <link rel="apple-touch-icon" href="/assets/lg-logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>LG Arkanoid</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/vendor/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/vendor/qrcode.min.js"></script>
</head>
<body>
    <div id="qrcode">
        <h2>SCAN TO JOIN</h2>
        <div id="qrcode-img"></div>
        <div style="font-family:'VT323',monospace;font-size:1.6rem;color:#4ade80;margin-top:14px;letter-spacing:2px;">Session Code</div>
        <div id="qr-session-code"></div>
        <div id="qr-match-meta">Loading match setup…</div>
        <div id="qr-instructions" style="font-family:'VT323',monospace;font-size:1.35rem;color:#aaa;margin-top:16px;line-height:1.55;">
            Open the LG Arkanoid app<br/>or enter code <span id="qr-session-code-inline" style="color:#fff;"></span>
            <div id="qr-waiting-text" style="color:#4ade80;margin-top:10px;">Waiting for first player…</div>
        </div>
        <div id="qr-player-list" style="font-family:'Space Grotesk',sans-serif;font-size:0.95rem;margin-top:12px;color:#9aa4af;"></div>
    </div>

    <div style="position:fixed; top:0; right:0; z-index:999; padding:6px; background:rgba(0,0,0,0.4); color:#fff; font-family:'Space Grotesk',sans-serif; font-size:10px; line-height:1.4; text-align:right;">
      Liquid Galaxy<br>LG Arkanoid
    </div>

    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
