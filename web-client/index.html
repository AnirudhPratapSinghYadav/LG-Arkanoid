<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LG Arkanoid">
    <link rel="apple-touch-icon" href="/assets/lg-logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>LG Arkanoid</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/vendor/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/vendor/qrcode.min.js"></script>
</head>
<body>
    <div class="stage-vignette" aria-hidden="true"></div>
    <div class="brand-mark" aria-hidden="true">
        <span class="brand-mark__eyebrow">Liquid Galaxy</span>
        <span class="brand-mark__name">LG Arkanoid</span>
    </div>

    <div id="qrcode" class="lobby-card" aria-live="polite">
        <div class="lobby-card__glow" aria-hidden="true"></div>
        <p class="lobby-card__kicker">Scan to join</p>
        <div id="qrcode-img" class="lobby-card__qr"></div>
        <p class="lobby-card__label">Session code</p>
        <div id="qr-session-code" class="lobby-card__code"></div>
        <div id="qr-match-meta" class="lobby-card__meta">Loading match setup…</div>
        <p id="qr-instructions" class="lobby-card__hint">
            Open the LG Arkanoid app<br>
            or type code <span id="qr-session-code-inline"></span>
        </p>
        <div id="qr-waiting-text" class="lobby-card__wait">Waiting for first player…</div>
        <div id="qr-player-list" class="lobby-card__players"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
