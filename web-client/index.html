<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LG Arkanoid">
    <link rel="apple-touch-icon" href="/assets/lg-logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>LG Arkanoid</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/vendor/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/vendor/qrcode.min.js"></script>
</head>
<body>
    <div class="stage-vignette" aria-hidden="true"></div>
    <div id="lgCorner" class="lg-corner" hidden>
        <img class="lg-corner__logo" src="/assets/lg-logo.png" alt="Liquid Galaxy">
        <div class="lg-corner__text">
            <span class="lg-corner__eyebrow">Liquid Galaxy</span>
            <span class="lg-corner__name">LG Arkanoid</span>
        </div>
    </div>
    <div class="brand-mark" aria-hidden="true">
        <span class="brand-mark__eyebrow">Liquid Galaxy</span>
        <span class="brand-mark__name">LG Arkanoid</span>
    </div>

    <div id="bootOverlay" class="boot-overlay" aria-live="polite">
        <div class="boot-overlay__ring" aria-hidden="true"></div>
        <img class="boot-overlay__logo" src="assets/lg-logo.png" alt="">
        <p class="boot-overlay__eyebrow">Liquid Galaxy</p>
        <h1 class="boot-overlay__title">LG Arkanoid</h1>
        <p class="boot-overlay__sub">Multi-screen arcade · phone controller</p>
        <div class="boot-overlay__status">
            <span class="boot-overlay__dot"></span>
            <span id="bootStatusText">Connecting to lobby…</span>
        </div>
    </div>

    <div id="qrcode" class="lobby-card" aria-live="polite">
        <div class="lobby-card__glow" aria-hidden="true"></div>
        <header class="lobby-card__head">
            <p class="lobby-card__kicker">Join this match</p>
            <h2 class="lobby-card__brand">LG Arkanoid</h2>
        </header>
        <div id="qrcode-img" class="lobby-card__qr"></div>
        <div class="lobby-card__code-block">
            <p class="lobby-card__label">Session code</p>
            <div id="qr-session-code" class="lobby-card__code"></div>
        </div>
        <div id="qr-match-meta" class="lobby-card__meta"></div>
        <div id="qr-waiting-text" class="lobby-card__wait">Waiting for first player…</div>
        <div id="qr-player-list" class="lobby-card__players"></div>
        <p id="qr-instructions" class="lobby-card__hint">
            Scan with the app or enter <span id="qr-session-code-inline"></span>
        </p>
    </div>

    <script src="js/config.js"></script>
    <script>
      (function showLeftmostLogo() {
        var id = (typeof window.SCREEN_ID !== 'undefined') ? Number(window.SCREEN_ID) : NaN;
        if (id !== 1) return;
        document.body.classList.add('is-leftmost-screen');
        var corner = document.getElementById('lgCorner');
        if (corner) {
          corner.hidden = false;
          corner.classList.add('is-visible');
        }
      })();
    </script>
    <script src="js/game.js"></script>
</body>
</html>
